name: Update README Widgets

on:
  schedule:
    - cron: "0 3 * * *" # Обновлять каждый день в 3 часа ночи
  workflow_dispatch: # Позволяет запускать обновление вручную

jobs:
  update-widgets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Генерация карточки с трофеями
      - name: Generate Trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          file: images/trophy.svg # Сохранит файл в папку images
          theme: algolia # Ваша тема
          max-rows: 1

      # Генерация графика активности
      - name: Generate Activity Graph SVG
        uses: Ashutosh00710/github-readme-activity-graph@main
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          file: images/activity-graph.svg # Сохранит файл в папку images
          theme: tokyo-night
          bg_color: 0D1117

      # Коммит и пуш новых файлов в репозиторий
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/*.svg
          git commit -m "Update README widgets" || exit 0
          git push
